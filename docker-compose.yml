services:
  # Development Service with Hot-Reloading
  dev:
    image: node:20-alpine
    container_name: mlte-landing-page-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - PORT=3000
      - WATCHPACK_POLLING=true
    command: sh -c "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run dev -- --hostname 0.0.0.0"

  # Production Service (Standalone Next.js server)
  prod:
    profiles:
      - prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlte-landing-page-prod
    ports:
      - "3000:3000"

volumes:
  node_modules:
